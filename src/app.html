<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FreeFeed API Explorer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
      /* Ensure last sidebar list item has a bottom border and no rounding */
      .scrollable-column .list-group-flush .list-group-item:last-child {
        border-bottom: var(--bs-border-width) solid var(--bs-border-color);
        border-radius: 0;
      }

      /* Full-height layout: navbar + scrollable columns fill the viewport */
      html,
      body,
      main {
        height: 100dvh;
        margin: 0;
      }

      main {
        display: flex;
        flex-direction: column;
      }

      /* Lock scrolling only when the page uses split-layout */
      main:has(.split-layout) {
        overflow: hidden;
      }

      /* Two-column split layout */
      .split-layout {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .split-sidebar {
        flex-shrink: 0;
        width: 33.333%;
      }

      .split-main {
        flex: 1;
        min-width: 0;
      }

      .scrollable-column {
        height: 100%;
        overflow-y: auto;
        padding-bottom: 2rem;
      }

      /* Responsive: stack columns on mobile and let the page scroll
         as one document instead of locking scroll inside each column. */
      @media (max-width: 767.98px) {
        html,
        body,
        main {
          height: auto;
          min-height: 100dvh;
        }

        main:has(.split-layout) {
          overflow: visible;
        }

        .split-layout {
          flex-direction: column;
          min-height: 0;
        }

        .split-sidebar {
          width: auto;
        }

        .scrollable-column {
          height: auto;
          overflow-y: visible;
          padding-bottom: 0;
        }

        .hide-below-md {
          display: none;
        }
      }

      @media (min-width: 768px) {
        .show-below-md {
          display: none;
        }
      }

      /* Keep the navbar above the offcanvas + backdrop so it stays visible
         (and its brand serves as the drawer's header — no duplicated title). */
      .site-navbar {
        position: sticky;
        top: 0;
        z-index: 1050;
      }
      .sidebar-offcanvas.offcanvas-start {
        top: var(--nav-h, 56px);
        height: calc(100dvh - var(--nav-h, 56px));
      }
      .offcanvas-backdrop {
        top: var(--nav-h, 56px);
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" style="visibility: hidden">
    <div style="display: contents">%sveltekit.body%</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Prevent FOUC by showing body after styles load
      document.addEventListener('DOMContentLoaded', function () {
        document.body.style.visibility = 'visible';
      });
      // Fallback: show after a short delay regardless
      setTimeout(function () {
        document.body.style.visibility = 'visible';
      }, 100);
    </script>
  </body>
</html>
